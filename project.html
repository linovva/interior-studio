<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/project.css">
    <title>Document</title>
</head>
<body>
    <!-- Логотип и навигация -->
    <header>
        <a href="index.html">INTERIOR-STUDIO</a>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Главная</a></li>
                <li><a href="index.html">Портфолио</a></li>
                <li><a href="#contacts">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <!-- Контейнер проекта -->
    <main class="hero" id="projectContainer"> 
        <section id="project-info" class="project-info"></section>
        <section id="project-interact" class="project-interact"></section>
    </main>

    <footer>
        <div class="info">
            <h2>СВЯЗЬ С НАМИ</h2>
            <h1>Обсудим ваш проект</h1>
            <p>Есть вопросы или предложения? Мы всегда готовы к общению</p>
        </div>
        <div class="contacts" id="contacts">
            <div class="contact-item">
                <h3>Телефон</h3>
                <p>+7 (123) 456-78-90</p>
            </div>
            <div class="contact-item">
                <h3>Email</h3>
                <p>info@interior-studio.ru</p>
            </div>
        </div>
    </footer> 

    <!-- Модалки разных просмотрщиков -->
    <dialog id="panoramaModal" class="panorama-modal">
        <button class="modal-close"></button>
        <div id="panoramaViewer"></div>
    </dialog>

    <dialog id="modelModal" class="model-modal">
        <button class="modal-close"></button>
        <div id="modelViewer"></div>
    </dialog>

    <dialog id="ARModal" class="AR-modal">
        <button class="modal-close"></button>
        <model-viewer 
            id="ARViewer"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls>
            <button slot="ar-button">
                Разместить в комнате
            </button>
        </model-viewer>
    </dialog>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
            }
        }
    </script>
    <script src="js/data.js"></script>
    <script type="module" src="js/project.js"></script>
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

</body>
</html>
